<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" role="img" aria-labelledby="title desc">
<title id="title">Build a Better Bedford</title>
<desc id="desc">Civil Engineering and Community Design Club logo with Bedford town forms and a green road.</desc>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b7d989"/>
    <stop offset="1" stop-color="#5b9b45"/>
  </linearGradient>
  <style>
    .navy{fill:#0b3356}
    .outline{fill:none;stroke:#0b3356;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
    .title{font:900 88px Arial,Helvetica,sans-serif;letter-spacing:-3px}
    .sub{font:600 26px Arial,Helvetica,sans-serif;letter-spacing:8px}
  </style>
</defs>

<!-- title -->
<g class="navy">
  <text x="40" y="150" class="title">Build a</text>
  <text x="40" y="250" class="title">Better</text>
  <text x="40" y="350" class="title">Bedford</text>
</g>

<!-- green hill -->
