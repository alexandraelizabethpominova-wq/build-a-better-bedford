  <path d="M485 230c0-31 24-55 54-55 10 0 21 3 29 8 8-25 31-42 58-42 34 0 62 27 62 62 0 2 0 5-1 7 24 7 42 29 42 56 0 31-25 57-56 57H543c-32 0-58-26-58-58 0-13 4-25 11-35z"/>
  <path d="M557 282v92"/>
  <!-- house -->
  <path d="M610 298v-104"/>
  <path d="M610 194l58-54 58 54"/>
  <path d="M636 298v-58h65v58"/>
  <!-- steeple -->
