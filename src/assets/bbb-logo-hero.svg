  <path d="M575 298h230"/>
</g>

<!-- road swoosh -->
<path d="M420 405c118-75 222-92 359-56-62 31-122 61-180 98-54 34-99 72-134 111 124-17 225-7 305 30-120 23-257 31-407 23l-14-26c79-45 153-85 220-119 57-29 101-49 131-60-95-18-188-13-280 18z" fill="#4f963f"/>
<path d="M422 405c94-45 181-58 260-39-84 30-165 67-242 111-24 14-51 30-79 49 37-42 75-80 114-111z" fill="#f8f8f4"/>

<!-- underline -->
