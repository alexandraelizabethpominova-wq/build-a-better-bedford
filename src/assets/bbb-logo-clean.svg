<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">Build a Better Bedford</title>
<desc id="desc">Build a Better Bedford Civil Engineering and Community Design Club logo</desc>
<defs>
  <style>
    .navy{fill:#0b3558}
    .green{fill:#4f8f3f}
    .pale{fill:#a9cc78}
    .outline{fill:none;stroke:#0b3558;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
    .title{font-family:Arial,Helvetica,sans-serif;font-weight:900}
    .sub{font-family:Arial,Helvetica,sans-serif;font-weight:600;letter-spacing:8px}
  </style>
</defs>

<!-- stacked title -->
<g class="navy title">
