<path fill="#fff" d="M500 414c83-45 170-61 261-51-54 23-110 50-165 84-32 20-60 41-85 61 62-6 123-2 184 11-79 13-159 17-238 10-28-2-55-6-80-10 33-31 74-66 123-105z"/>

